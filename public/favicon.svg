<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#0f0f13"/>

  <!-- Outer hexagon glow -->
  <polygon
    points="50,6 88,27.5 88,72.5 50,94 12,72.5 12,27.5"
    fill="none"
    stroke="#00d4ff"
    stroke-width="2"
    opacity="0.35"
  />

  <!-- Inner hexagon -->
  <polygon
    points="50,14 80,31 80,69 50,86 20,69 20,31"
    fill="#00d4ff"
    fill-opacity="0.12"
    stroke="#00d4ff"
    stroke-width="2"
  />

  <!-- Glow filter -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Letter P with glow -->
  <text
    x="50"
    y="68"
    text-anchor="middle"
    font-family="Impact, Arial Narrow, Arial, sans-serif"
    font-size="58"
    font-weight="400"
    fill="white"
    filter="url(#glow)"
  >P</text>
</svg>
